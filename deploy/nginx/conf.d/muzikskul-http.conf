# MMMuzik V2 — HTTP :80 server (muzikskul.xyz). ALWAYS loadable.
#
# This file contains NO `ssl_certificate` references, so nginx can boot from it
# even before any Let's Encrypt certificate exists. It serves the ACME http-01
# challenge and redirects everything else to HTTPS. Pairing this with a separate,
# cert-gated `muzikskul-ssl.conf` is what breaks the nginx<->certbot deadlock:
# nginx is alive on :80 first, THEN the cert is issued, THEN HTTPS is enabled.

# Upgrade header -> Connection header mapping for the WebSocket/Socket.IO handshake.
# Defined here (the always-present file) so the :443 proxy block can use it.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name muzikskul.xyz www.muzikskul.xyz;

    # Let's Encrypt http-01 challenge — served directly from the shared webroot
    # volume and NEVER redirected (this location is matched before `location /`).
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Everything else -> canonical HTTPS root.
    location / {
        return 301 https://muzikskul.xyz$request_uri;
    }
}
