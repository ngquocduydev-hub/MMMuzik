# MMMuzik V2 — Nginx reverse proxy for muzikskul.xyz (containerized).
# Mounted at /etc/nginx/conf.d/ (replaces the stock default.conf). This file is
# included inside the http{} block, so `map` and the shared ssl_* directives below
# are valid here and are inherited by every server block.
#
# Why a single `location /` proxy: the app is ONE origin on port 3000 serving the
# UI, REST API, AND Socket.IO (/socket.io/). The WebSocket upgrade headers below
# apply to every request, so the realtime transport works without a separate block.

# Maps the Upgrade request header → the Connection header the upstream needs.
# Normal HTTP request → "close"; WebSocket handshake → "upgrade".
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# ── Shared TLS policy (Mozilla "intermediate", ECDHE-only) ─────────────────────
# Set at http context so BOTH 443 server blocks inherit it. ECDHE-only ciphers
# need no custom dhparam, so there is no external file/download dependency — nginx
# starts as soon as the cert files exist.
ssl_protocols TLSv1.2 TLSv1.3;
ssl_prefer_server_ciphers off;
ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
ssl_session_timeout 1d;
ssl_session_cache shared:MozSSL:10m;
ssl_session_tickets off;
add_header Strict-Transport-Security "max-age=63072000" always;

# ── HTTP :80 — ACME challenge + redirect everything else to HTTPS ──────────────
server {
    listen 80;
    listen [::]:80;
    server_name muzikskul.xyz www.muzikskul.xyz;

    # Let's Encrypt http-01 challenge (served from the shared webroot volume).
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Everything else → canonical HTTPS root.
    location / {
        return 301 https://muzikskul.xyz$request_uri;
    }
}

# ── HTTPS :443 — www → canonical root (so the origin always equals APP_URL) ────
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.muzikskul.xyz;

    ssl_certificate     /etc/letsencrypt/live/muzikskul.xyz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/muzikskul.xyz/privkey.pem;

    return 301 https://muzikskul.xyz$request_uri;
}

# ── HTTPS :443 — the app (canonical origin = https://muzikskul.xyz) ────────────
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name muzikskul.xyz;

    ssl_certificate     /etc/letsencrypt/live/muzikskul.xyz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/muzikskul.xyz/privkey.pem;

    # Uploads are tiny (chat/queue), but be generous for safety.
    client_max_body_size 5m;

    location / {
        proxy_pass http://app:3000;

        # ── WebSocket / Socket.IO upgrade (requirements 6 & 7) ──
        proxy_http_version 1.1;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;

        # Preserve the real client + protocol for the app behind the proxy.
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Long-lived realtime connections must not be cut by the proxy.
        proxy_read_timeout  86400s;
        proxy_send_timeout  86400s;
        proxy_buffering     off;
    }
}
