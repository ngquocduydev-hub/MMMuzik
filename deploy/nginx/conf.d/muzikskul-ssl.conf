# MMMuzik V2 — HTTPS :443 servers (muzikskul.xyz). CERT-GATED.
#
# This file references the Let's Encrypt certificate, so nginx will crash-loop if
# it is loaded BEFORE the cert exists. On a fresh deploy it is therefore moved out
# of conf.d during SSL bootstrap (see deploy/init-letsencrypt.sh) and moved back in
# only after the real cert has been issued. In steady state (cert present) it lives
# here permanently and nginx loads it normally on every boot/reload.
#
# `$connection_upgrade` and the `map` it comes from are defined in
# muzikskul-http.conf (always present), so they are available here.

# ── Shared TLS policy (Mozilla "intermediate", ECDHE-only) ─────────────────────
# ECDHE-only ciphers need no custom dhparam file, so there is no external download
# dependency — nginx starts as soon as the cert files exist.
ssl_protocols TLSv1.2 TLSv1.3;
ssl_prefer_server_ciphers off;
ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
ssl_session_timeout 1d;
ssl_session_cache shared:MozSSL:10m;
ssl_session_tickets off;
add_header Strict-Transport-Security "max-age=63072000" always;

# ── HTTPS :443 — www → canonical root (origin always equals APP_URL) ───────────
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.muzikskul.xyz;

    ssl_certificate     /etc/letsencrypt/live/muzikskul.xyz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/muzikskul.xyz/privkey.pem;

    return 301 https://muzikskul.xyz$request_uri;
}

# ── HTTPS :443 — the app (canonical origin = https://muzikskul.xyz) ────────────
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name muzikskul.xyz;

    client_max_body_size 5m;

    ssl_certificate     /etc/letsencrypt/live/muzikskul.xyz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/muzikskul.xyz/privkey.pem;

    location / {
        proxy_pass http://app:3000;

        # ── WebSocket / Socket.IO upgrade ──
        proxy_http_version 1.1;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;

        # Preserve the real client + protocol for the app behind the proxy.
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Long-lived realtime connections must not be cut by the proxy.
        proxy_read_timeout  86400s;
        proxy_send_timeout  86400s;
        proxy_buffering     off;
    }
}
